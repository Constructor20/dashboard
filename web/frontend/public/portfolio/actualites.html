<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités Tech - Christophe</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a12;
      color: #e8e8f0;
      min-height: 100vh;
    }
    .actus-header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      max-width: 760px;
      margin: 0 auto;
    }
    .actus-header h1 {
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .actus-header p {
      font-size: 1rem;
      color: rgba(255,255,255,0.35);
    }
    .actus-header .back-link {
      display: inline-block;
      margin-top: 1.2rem;
      font-size: 0.9rem;
      color: rgba(0,212,255,0.5);
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.3s;
    }
    .actus-header .back-link:hover {
      color: #00d4ff;
    }
    .actus-list {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }
    .actus-item {
      padding: 1.6rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: padding 0.3s;
    }
    .actus-item:first-child {
      padding-top: 0;
    }
    .actus-item:last-child {
      border-bottom: none;
    }
    .actus-item:hover {
      padding-left: 1rem;
    }
    .actus-item-source {
      font-size: 0.75rem;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .actus-item-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .actus-item-desc {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      margin-bottom: 0.6rem;
    }
    .actus-item-date {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.3);
    }
    .actus-count {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.25);
      margin-bottom: 2rem;
    }
    .loading {
      text-align: center;
      color: rgba(255,255,255,0.3);
      padding: 4rem 2rem;
      font-style: italic;
    }
    .actus-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .actus-modal.hidden { display: none; }
    .actus-modal-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
    }
    .actus-modal-content {
      position: relative;
      width: min(640px, 100%);
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(10,14,23,0.97);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 0 40px rgba(0,212,255,0.1);
    }
    .actus-modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 2rem;
      cursor: pointer;
      transition: color 0.3s;
      line-height: 1;
    }
    .actus-modal-close:hover { color: #fff; }
    .actus-modal-source {
      font-size: 0.8rem;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .actus-modal-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }
    .actus-modal-date {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 1.5rem;
    }
    .actus-modal-desc {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.8);
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .actus-modal-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 12px 24px;
      background: rgba(0,212,255,0.1);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 8px;
      color: #00d4ff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .actus-modal-link:hover {
      background: rgba(0,212,255,0.2);
      box-shadow: 0 0 25px rgba(0,212,255,0.2);
    }
  </style>
</head>
<body>
  <div class="actus-header">
    <h1>Actualités Tech & Datacenter</h1>
    <p>Articles récents issus des flux RSS</p>
    <a href="index.html" class="back-link">← Retour au portfolio</a>
  </div>
  <div id="actus-count" class="actus-count"></div>
  <div id="actus-list" class="actus-list">
    <div class="loading">Chargement des actualités...</div>
  </div>

  <div id="actus-modal" class="actus-modal hidden">
    <div class="actus-modal-bg"></div>
    <div class="actus-modal-content">
      <button class="actus-modal-close">&times;</button>
      <div class="actus-modal-body"></div>
    </div>
  </div>

  <script>
    function formatDate(d) {
      if (!d) return "";
      return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function stripHtml(t) {
      return (t || "").replace(/<[^>]*>/g, "").replace(/&\w+;/g, " ").replace(/\s+/g, " ").trim();
    }
    function micro(t) {
      const s = stripHtml(t);
      return s.length > 100 ? s.slice(0, 100) + "..." : s;
    }

    let allNews = [];

    function openModal(item) {
      const modal = document.getElementById("actus-modal");
      document.querySelector(".actus-modal-body").innerHTML = `
        <div class="actus-modal-source">${item.source || "Actualité"}</div>
        <div class="actus-modal-title">${item.title}</div>
        <div class="actus-modal-date">${formatDate(item.pubDate || item.date)}</div>
        <div class="actus-modal-desc">${stripHtml(item.description || "Aucune description.")}</div>
        <a href="${item.link}" target="_blank" class="actus-modal-link">Lire l'article original →</a>
      `;
      modal.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("actus-modal").classList.add("hidden");
    }

    document.querySelector(".actus-modal-close").addEventListener("click", closeModal);
    document.querySelector(".actus-modal-bg").addEventListener("click", closeModal);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    async function load() {
      try {
        const r = await fetch("data/news.json?_=" + Date.now());
        if (!r.ok) throw Error();
        const data = await r.json();
        allNews = data.items || [];
        document.getElementById("actus-count").textContent = allNews.length + " articles";
        const list = document.getElementById("actus-list");
        list.innerHTML = allNews.map((item, i) => `
          <div class="actus-item" data-idx="${i}">
            <div class="actus-item-source">${item.source || "Actualité"}</div>
            <div class="actus-item-title">${item.title}</div>
            <div class="actus-item-desc">${micro(item.description)}</div>
            <div class="actus-item-date">${formatDate(item.pubDate || item.date)}</div>
          </div>
        `).join("");
        list.querySelectorAll(".actus-item").forEach((el) => {
          el.addEventListener("click", () => openModal(allNews[parseInt(el.dataset.idx)]));
        });
      } catch {
        document.getElementById("actus-list").innerHTML = '<div class="loading">Impossible de charger les actualités.</div>';
      }
    }
    load();
  </script>
</body>
</html>
